<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Latihan Web GIS</title>
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <style>html, body, #map { height: 100%; width: 100%; margin: 0px; }</style>
</head>
<body>
  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <div id="map"></div>
  <script>
    var map = L.map('map').setView([-7.677567, 110.406899], 12);
    var basemap1 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    });
    var basemap2 = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: 'Map data &copy; Google'
    });
    basemap1.addTo(map);
    var marker1 = L.marker([-7.766715, 110.377460], {draggable: true});
    marker1.addTo(map);
    marker1.bindPopup("Gedung B DIV-SIG UGM");
    var marker2 = L.marker([-7.743168, 110.350276]);
    marker2.addTo(map);
    marker2.bindPopup("RS.Akademik UGM");
    var baseMaps = { "Esri Imagery": basemap1, "Google Street": basemap2 };
    var overlayMaps = { "Gedung B DIVSIG UGM": marker1, "RS.Akademik UGM": marker2 };
    L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map);
    L.control.scale({ maxWidth: 150, position: 'bottomright' }).addTo(map);
  </script>
</body>
</html>
